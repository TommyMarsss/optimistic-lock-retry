<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乐观锁并发更新回放</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --panel2: #1d2638; --border: #2a3550;
    --text: #dbe4f5; --dim: #8a97b5; --accent: #4da3ff;
    --ok: #3ecf8e; --conflict: #ff9f43; --backoff: #b678ff; --danger: #ff5470;
    --yield: #ffd166; --idle: #5a6880;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header { padding: 16px 20px 8px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 12px; }
  #tabs { display: flex; gap: 8px; padding: 8px 20px; flex-wrap: wrap; }
  #tabs button {
    background: var(--panel); color: var(--dim); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px;
  }
  #tabs button.active { color: #fff; border-color: var(--accent); background: var(--panel2); }
  main { padding: 0 20px 20px; display: grid; gap: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--dim); font-weight: 600; letter-spacing: .5px; }
  #summary { display: flex; flex-wrap: wrap; gap: 6px 22px; }
  #summary .kv { font-size: 12.5px; }
  #summary .kv b { color: var(--accent); font-weight: 600; margin-right: 6px; }
  #resource { display: flex; gap: 32px; align-items: baseline; }
  #resource .big { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #resource .lbl { color: var(--dim); font-size: 12px; }
  #counters { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 6px; }
  #counters span { font-size: 12.5px; color: var(--dim); }
  #counters b { font-variant-numeric: tabular-nums; }
  .c-ok { color: var(--ok); } .c-conflict { color: var(--conflict); }
  .c-giveup { color: var(--danger); } .c-livelock { color: #ff2d55; }
  #writers { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .w {
    background: var(--panel2); border: 1px solid var(--border); border-left: 4px solid var(--dim);
    border-radius: 6px; padding: 6px 9px; min-height: 56px; transition: border-color .15s, background .15s;
  }
  .w .wid { font-weight: 700; font-size: 12px; color: var(--dim); }
  .w .wst { font-size: 12.5px; margin-top: 2px; }
  .w .winfo { font-size: 11px; color: var(--dim); }
  .w.st-read     { border-left-color: var(--accent); }
  .w.st-ok       { border-left-color: var(--ok); }
  .w.st-ok .wst  { color: var(--ok); }
  .w.st-conflict { border-left-color: var(--conflict); background: #2a2118; }
  .w.st-conflict .wst { color: var(--conflict); }
  .w.st-backoff  { border-left-color: var(--backoff); }
  .w.st-backoff .wst { color: var(--backoff); }
  .w.st-giveup   { border-left-color: var(--danger); background: #2b1720; }
  .w.st-giveup .wst { color: var(--danger); }
  .w.st-yield    { border-left-color: var(--yield); background: #2a2517; }
  .w.st-yield .wst { color: var(--yield); }
  .w.st-done     { border-left-color: var(--ok); opacity: .65; }
  #controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #controls button, #controls select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  #controls button:hover { border-color: var(--accent); }
  #slider { flex: 1; min-width: 160px; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12.5px; min-width: 130px; text-align: right; }
  #timeline { width: 100%; height: 64px; display: block; cursor: crosshair; border-radius: 6px; background: var(--panel2); }
  #banner {
    display: none; position: sticky; top: 0; z-index: 10;
    background: #3a0d18; border: 1px solid #ff2d55; color: #ffb3c1;
    padding: 10px 16px; border-radius: 8px; font-weight: 600;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { background: #571224; } }
  #log { max-height: 260px; overflow-y: auto; font: 12px/1.7 ui-monospace, Menlo, monospace; }
  #log .row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  #log .row .t { color: #54628a; display: inline-block; width: 86px; }
  #log .row.ev-commit_ok { color: var(--ok); }
  #log .row.ev-conflict { color: var(--conflict); }
  #log .row.ev-giveup { color: var(--danger); }
  #log .row.ev-livelock_detected { color: #ff8fa3; background: #2b0f18; font-weight: 700; }
  #log .row.ev-livelock_yield { color: var(--yield); }
  #log .row.ev-backoff { color: var(--backoff); opacity: .8; }
  #llist { display: flex; flex-direction: column; gap: 4px; }
  #llist .item { font-size: 12.5px; color: #ffb3c1; display: flex; gap: 8px; align-items: center; }
  #llist button {
    background: none; border: 1px solid #ff2d55; color: #ff8fa3; border-radius: 4px;
    font-size: 11px; padding: 1px 8px; cursor: pointer; flex-shrink: 0;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>乐观锁并发更新回放</h1>
  <div class="sub">基于版本号的乐观锁 · 指数退避 + 抖动重试 · 活锁检测与打破 —— 全部数据与逻辑内嵌于本文件</div>
</header>
<div id="tabs"></div>
<main>
  <div class="panel"><h2>场景报告</h2><div id="summary"></div></div>
  <div id="banner"></div>
  <div class="panel">
    <h2>共享资源</h2>
    <div id="resource">
      <div><div class="lbl">当前值</div><div class="big" id="rval">0</div></div>
      <div><div class="lbl">版本号</div><div class="big" id="rver">0</div></div>
    </div>
    <div id="counters">
      <span>成功提交 <b class="c-ok" id="cOk">0</b></span>
      <span>冲突 <b class="c-conflict" id="cConf">0</b></span>
      <span>放弃 <b class="c-giveup" id="cGive">0</b></span>
      <span>活锁触发 <b class="c-livelock" id="cLive">0</b></span>
    </div>
  </div>
  <div class="panel"><h2>写者状态</h2><div id="writers"></div></div>
  <div class="panel">
    <div id="controls">
      <button id="btnPlay">▶ 播放</button>
      <button id="btnPrev">◀ 上一事件</button>
      <button id="btnNext">下一事件 ▶</button>
      <button id="btnRestart">↺ 重播</button>
      <select id="speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="8">8×</option>
      </select>
      <input type="range" id="slider" min="0" max="1000" value="0">
      <span id="time">0 / 0 ms</span>
    </div>
    <canvas id="timeline"></canvas>
  </div>
  <div class="panel hidden" id="lpanel"><h2>⚠ 活锁检测事件（点击跳转）</h2><div id="llist"></div></div>
  <div class="panel"><h2>事件日志</h2><div id="log"></div></div>
</main>

const TYPE_LABEL = {
  read: "读取", commit_ok: "提交成功", conflict: "冲突", backoff: "退避",
  giveup: "放弃", livelock_detected: "⚠ 检测到活锁", livelock_yield: "强制让步", done: "完成"
};
const TYPE_CLASS = {
  read: "st-read", commit_ok: "st-ok", conflict: "st-conflict", backoff: "st-backoff",
  giveup: "st-giveup", livelock_yield: "st-yield", done: "st-done"
};

let cur = 0;            // 当前场景下标
let evts = [];          // 当前场景事件
let tMax = 0;
let tCur = 0;
let applied = 0;        // 已应用的事件下标（events 按 t 升序）
let playing = false;
let speed = 1;
let lastFrame = null;
let writers = [];       // 每个写者的 DOM 引用
let bannerTimer = null;

const $ = id => document.getElementById(id);

function fmtT(t) { return t.toFixed(1) + " ms"; }

function describe(e) {
  const w = e.writer >= 0 ? "W" + e.writer : "系统";
  let s = "[" + w + "] " + (TYPE_LABEL[e.type] || e.type);
  if (e.attempt) s += " · 第" + e.attempt + "次尝试";
  if (e.type === "read") s += " · v" + e.version + " = " + e.value;
  if (e.type === "commit_ok") s += " · → v" + e.version + " = " + e.value;
  if (e.type === "conflict") s += " · 持有过期版本 v" + e.version;
  if (e.delayMs) s += " · " + e.delayMs.toFixed(1) + "ms";
  if (e.msg) s += " · " + e.msg;
  return s;
}

function buildTabs() {
  const tabs = $("tabs");
  tabs.innerHTML = "";
  DATA.scenarios.forEach((s, i) => {
    const b = document.createElement("button");
    b.textContent = s.name;
    b.className = i === cur ? "active" : "";
    b.onclick = () => selectScenario(i);
    tabs.appendChild(b);
  });
}

function selectScenario(i) {
  cur = i;
  const S = DATA.scenarios[i];
  evts = S.events;
  tMax = evts.length ? evts[evts.length - 1].t : 0;
  buildTabs();
  // 报告
  $("summary").innerHTML = S.summary.map(kv =>
    '<span class="kv"><b>' + kv.label + "</b>" + kv.value + "</span>").join("");
  // 写者卡片
  const wc = $("writers");
  wc.innerHTML = "";
  writers = [];
  for (let w = 0; w < S.writers; w++) {
    const d = document.createElement("div");
    d.className = "w";
    d.innerHTML = '<div class="wid">W' + w + '</div><div class="wst">等待开始</div><div class="winfo"></div>';
    wc.appendChild(d);
    writers.push({ el: d, st: d.children[1], info: d.children[2] });
  }
  // 活锁事件列表
  const ll = evts.filter(e => e.type === "livelock_detected");
  $("lpanel").classList.toggle("hidden", ll.length === 0);
  const llist = $("llist");
  llist.innerHTML = "";
  ll.forEach(e => {
    const item = document.createElement("div");
    item.className = "item";
    const btn = document.createElement("button");
    btn.textContent = "跳转 " + fmtT(e.t);
    btn.onclick = () => { pause(); seek(e.t); };
    const txt = document.createElement("span");
    txt.textContent = e.msg || "";
    item.appendChild(btn); item.appendChild(txt);
    llist.appendChild(item);
  });
  resetPlayback();
  drawTimeline();
}

function resetPlayback() {
  tCur = 0; applied = 0;
  $("rval").textContent = "0";
  $("rver").textContent = "0";
  $("cOk").textContent = "0"; $("cConf").textContent = "0";
  $("cGive").textContent = "0"; $("cLive").textContent = "0";
  $("log").innerHTML = "";
  writers.forEach(w => {
    w.el.className = "w";
    w.st.textContent = "等待开始";
    w.info.textContent = "";
  });
  updateTimeUI();
}

function applyEvent(e) {
  switch (e.type) {
    case "commit_ok":
      $("rval").textContent = e.value;
      $("rver").textContent = e.version;
      $("cOk").textContent = +$("cOk").textContent + 1;
      break;
    case "conflict":
      $("cConf").textContent = +$("cConf").textContent + 1;
      break;
    case "giveup":
      $("cGive").textContent = +$("cGive").textContent + 1;
      break;
    case "livelock_detected":
      $("cLive").textContent = +$("cLive").textContent + 1;
      flashBanner(e.msg || "检测到活锁");
      break;
  }
  if (e.writer >= 0) {
    const w = writers[e.writer];
    w.el.className = "w " + (TYPE_CLASS[e.type] || "");
    let label = TYPE_LABEL[e.type] || e.type;
    if (e.type === "read") label = "读取 v" + e.version;
    if (e.type === "commit_ok") label = "已提交 → v" + e.version;
    if (e.type === "conflict") label = "冲突（v" + e.version + " 已过期）";
    if (e.type === "backoff") label = "退避 " + e.delayMs.toFixed(1) + "ms";
    if (e.type === "livelock_yield") label = "让步 " + e.delayMs.toFixed(1) + "ms";
    if (e.type === "done") label = "完成 · " + (e.msg || "");
    w.st.textContent = label;
    w.info.textContent = e.attempt ? "第 " + e.attempt + " 次尝试" : "";
  }
  // 日志（最多保留 250 行 DOM）
  const log = $("log");
  const row = document.createElement("div");
  row.className = "row ev-" + e.type;
  row.innerHTML = '<span class="t">' + fmtT(e.t) + "</span>" + describe(e);
  log.appendChild(row);
  while (log.children.length > 250) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}

function flashBanner(msg) {
  const b = $("banner");
  b.textContent = "⚠ 活锁检测触发：" + msg;
  b.style.display = "block";
  if (bannerTimer) clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => { b.style.display = "none"; }, 3000);
}

function applyUpTo(t) {
  while (applied < evts.length && evts[applied].t <= t) {
    applyEvent(evts[applied]);
    applied++;
  }
}

function seek(t) {
  tCur = Math.max(0, Math.min(t, tMax));
  if (applied > 0 && (applied >= evts.length || evts[applied].t > tCur || tCur < (applied ? evts[applied - 1].t : 0))) {
    // 需要回退：重置后重放
    const keepPlaying = playing;
    resetPlayback();
    playing = keepPlaying;
  }
  applyUpTo(tCur);
  updateTimeUI();
  drawTimeline();
}

function updateTimeUI() {
  $("time").textContent = Math.round(tCur) + " / " + Math.round(tMax) + " ms";
  $("slider").value = tMax > 0 ? Math.round(tCur / tMax * 1000) : 0;
}

function drawTimeline() {
  const cv = $("timeline");
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  if (!tMax) return;
  const x = t => t / tMax * (W - 4) + 2;
  for (const e of evts) {
    const ex = x(e.t);
    if (e.type === "livelock_detected") {
      ctx.strokeStyle = "#ff2d55"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(ex, 2); ctx.lineTo(ex, H - 2); ctx.stroke();
    } else if (e.type === "commit_ok") {
      ctx.strokeStyle = "rgba(62,207,142,.7)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(ex, H * 0.55); ctx.lineTo(ex, H - 4); ctx.stroke();
    } else if (e.type === "conflict") {
      ctx.strokeStyle = "rgba(255,159,67,.45)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(ex, 4); ctx.lineTo(ex, H * 0.4); ctx.stroke();
    } else if (e.type === "giveup") {
      ctx.strokeStyle = "#ff5470"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(ex, H * 0.3); ctx.lineTo(ex, H * 0.7); ctx.stroke();
    }
  }
  // 播放游标
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x(tCur), 0); ctx.lineTo(x(tCur), H); ctx.stroke();
}

function frame(ts) {
  if (playing) {
    if (lastFrame == null) lastFrame = ts;
    const dt = ts - lastFrame;
    tCur += dt * speed;
    if (tCur >= tMax) { tCur = tMax; pause(); }
    applyUpTo(tCur);
    updateTimeUI();
    drawTimeline();
  }
  lastFrame = playing ? ts : null;
  requestAnimationFrame(frame);
}

function play() { playing = true; $("btnPlay").textContent = "⏸ 暂停"; }
function pause() { playing = false; $("btnPlay").textContent = "▶ 播放"; }

$("btnPlay").onclick = () => {
  if (playing) { pause(); return; }
  if (tCur >= tMax) resetPlayback();
  play();
};
$("btnRestart").onclick = () => { resetPlayback(); drawTimeline(); };
$("speed").onchange = e => { speed = parseFloat(e.target.value); };
$("slider").oninput = e => { pause(); seek(e.target.value / 1000 * tMax); };
$("timeline").onclick = e => {
  const r = e.target.getBoundingClientRect();
  pause(); seek((e.clientX - r.left) / r.width * tMax);
};
$("btnNext").onclick = () => {
  pause();
  if (applied < evts.length) seek(evts[applied].t + 0.0001);
};
$("btnPrev").onclick = () => {
  pause();
  if (applied <= 1) { seek(0); return; }
  seek(evts[applied - 2].t + 0.0001);
};

selectScenario(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
